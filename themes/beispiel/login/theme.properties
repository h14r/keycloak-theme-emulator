# Beispiel-Theme: erbt alles von keycloak.v2 und überschreibt nur Farben und einige Texte.
parent=keycloak.v2
import=common/keycloak

# Achtung: "styles" ersetzt den Wert des Parents vollständig –
# die Parent-CSS daher mit aufführen, wenn sie weiter gelten soll.
styles=css/styles.css css/beispiel.css

# Sprachen, die das Theme anbietet (Realm settings → Localization)
locales=de,en
