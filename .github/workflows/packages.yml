# Baut den Keycloak Theme Emulator
# - als installierbare macOS-App (.dmg) für Apple Silicon (arm64) und Intel (x64)
# - als Windows-Installer (.msi, x64, Installation ohne Administratorrechte)
# - als portable Fassung (ZIP, für macOS/Windows/Linux, benötigt Java 21)
#
# - bei jedem Push und Pull Request: Pakete als Artefakte des Workflow-Laufs
# - auf main bzw. per "Run workflow": Gibt es zur Version aus pom.xml noch kein
#   Release, wird es angelegt (Tag v<version> entsteht dabei auf GitHub).
#   Neue Version veröffentlichen = Version in pom.xml erhöhen und auf main pushen.
#   Öffentliches Repository → Download ohne GitHub-Anmeldung.
# - ein manuell gepushter Tag "v*" veröffentlicht ebenfalls
name: Pakete (.dmg, .msi und portable ZIP)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      # Signieren + Notarisieren nur, wenn die Apple-Zugangsdaten als Secrets hinterlegt sind
      # (siehe README, Abschnitt „Signieren und notarisieren“). Ohne sie entsteht eine
      # unsignierte .dmg wie bisher.
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Prüfung aller Seiten und Mails (Beispiel-Theme)
        run: |
          mvn -q -B package
          java -jar target/keycloak-theme-emulator.jar --check --locale de

      - name: Signierzertifikat importieren
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPW="$(openssl rand -hex 16)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "MAC_SIGNING_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: .dmg bauen
        env:
          MAC_SIGNING_NAME: ${{ env.HAS_SIGNING == 'true' && secrets.MACOS_SIGNING_NAME || '' }}
        run: packaging/build-installer.sh dmg

      - name: Notarisieren (Apple)
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG="$(ls target/installer/*.dmg)"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature -v "$DMG"

      - name: Installierte App starten (Smoke-Test)
        run: |
          DMG="$(ls target/installer/*.dmg)"
          MOUNT="$(hdiutil attach -nobrowse -readonly "$DMG" | tail -1 | cut -f3-)"
          STATUS=0
          if [[ "$HAS_SIGNING" == "true" ]]; then
            # Gatekeeper-Prüfung wie beim Nutzer: muss „accepted … Notarized Developer ID“ ergeben
            spctl --assess --type execute -vv "$MOUNT/Keycloak Theme Emulator.app" || STATUS=$?
          fi
          "$MOUNT/Keycloak Theme Emulator.app/Contents/MacOS/Keycloak Theme Emulator" --check --locale de || STATUS=$?
          cat "$HOME/Keycloak Theme Emulator/emulator.log"
          hdiutil detach "$MOUNT"
          exit $STATUS

      - name: Update-Test – ältere Version wird ersetzt, Themes und Einstellungen bleiben
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)"
          APP="Keycloak Theme Emulator.app"
          WORK="$HOME/Keycloak Theme Emulator"
          # vorherige veröffentlichte Version für diese Architektur
          OLD_URL="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases?per_page=20" \
            | python3 -c "import json,sys; v='v$VERSION'; a='-${{ matrix.arch }}.dmg'
          for r in json.load(sys.stdin):
              if r['tag_name'] != v:
                  u = [x['browser_download_url'] for x in r['assets'] if x['name'].endswith(a)]
                  if u: print(u[0]); break")"
          if [[ -z "$OLD_URL" ]]; then echo "Keine ältere Version veröffentlicht – Update-Test entfällt."; exit 0; fi
          echo "Ältere Version: $OLD_URL"
          curl -fsSL -o "$RUNNER_TEMP/old.dmg" "$OLD_URL"
          OLDM="$(hdiutil attach -nobrowse -readonly "$RUNNER_TEMP/old.dmg" | tail -1 | cut -f3-)"
          mkdir -p "$HOME/Applications"
          cp -R "$OLDM/$APP" "$HOME/Applications/"      # alte Version an anderer Stelle installiert
          cp -R "$OLDM/$APP" "/Applications/"            # und eine zweite am üblichen Ort
          hdiutil detach -quiet "$OLDM"
          # Vorlagen und Einstellungen des Nutzers
          mkdir -p "$WORK/themes/update-test/login"
          echo "parent=keycloak.v2" > "$WORK/themes/update-test/login/theme.properties"
          echo '{"kcemu-ui":"{\"appearance\":\"dark\"}"}' > "$WORK/ui-settings.json"
          cp "$WORK/scenario.json" "$RUNNER_TEMP/scenario-before.json"

          ./install-mac.sh --dmg "$(ls target/installer/*.dmg)" --no-start

          FAIL=0
          COUNT=$(ls -d /Applications/Keycloak\ Theme\ Emulator*.app "$HOME"/Applications/Keycloak\ Theme\ Emulator*.app 2>/dev/null | wc -l | tr -d ' ')
          NOW="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "/Applications/$APP/Contents/Info.plist")"
          echo "Installationen: $COUNT, Version: $NOW"
          [[ "$COUNT" == 1 && "$NOW" == "$VERSION" ]] || { echo "::error::Nicht genau eine Installation der neuen Version"; FAIL=1; }
          [[ -f "$WORK/themes/update-test/login/theme.properties" ]] || { echo "::error::Eigenes Theme fehlt nach dem Update"; FAIL=1; }
          grep -q '"appearance' "$WORK/ui-settings.json" || { echo "::error::Einstellungen fehlen nach dem Update"; FAIL=1; }
          cmp -s "$WORK/scenario.json" "$RUNNER_TEMP/scenario-before.json" || { echo "::error::scenario.json wurde verändert"; FAIL=1; }

          # Aufräumen beim Start: alte Kopie per Hand nach ~/Programme gelegt, neue App starten
          OLDM="$(hdiutil attach -nobrowse -readonly "$RUNNER_TEMP/old.dmg" | tail -1 | cut -f3-)"
          cp -R "$OLDM/$APP" "$HOME/Applications/"
          hdiutil detach -quiet "$OLDM"
          "/Applications/$APP/Contents/MacOS/Keycloak Theme Emulator" --check --locale de || FAIL=1
          grep "Ältere Installation" "$WORK/emulator.log" || true
          [[ ! -e "$HOME/Applications/$APP" ]] || { echo "::error::Alte Kopie wurde beim Start nicht entfernt"; FAIL=1; }
          exit $FAIL

      - name: Dateiname mit Architektur
        id: name
        run: |
          VERSION="$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)"
          FILE="Keycloak-Theme-Emulator-${VERSION}-${{ matrix.arch }}.dmg"
          mv target/installer/*.dmg "target/installer/$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.file }}
          path: target/installer/${{ steps.name.outputs.file }}
          if-no-files-found: error

  msi:
    runs-on: windows-2022
    env:
      # Signieren nur, wenn ein Code-Signing-Zertifikat als Secret hinterlegt ist
      # (siehe README, Abschnitt „Windows: signieren“). Ohne entsteht eine unsignierte .msi.
      HAS_SIGNING: ${{ secrets.WINDOWS_CERTIFICATE_PFX != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Prüfung aller Seiten und Mails unter Windows (Beispiel-Theme)
        run: |
          mvn -q -B package
          java -jar target/keycloak-theme-emulator.jar --check --locale de

      - name: WiX Toolset 3 bereitstellen (von jpackage für .msi benötigt)
        shell: pwsh
        run: |
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Filter "WiX Toolset v3*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wix) {
            choco install wixtoolset --version 3.14.1 -y --no-progress
            $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Filter "WiX Toolset v3*" -Directory | Select-Object -First 1
          }
          Write-Output "WiX: $($wix.FullName)"
          "$($wix.FullName)\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: .msi bauen
        run: packaging/build-installer.sh msi

      - name: .msi signieren
        if: env.HAS_SIGNING == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          $msi = (Get-ChildItem target/installer/*.msi | Select-Object -First 1).FullName
          & $signtool.FullName sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f $pfx /p $env:PFX_PASSWORD $msi
          $code = $LASTEXITCODE
          Remove-Item $pfx
          if ($code -ne 0) { exit $code }
          & $signtool.FullName verify /pa $msi
          exit $LASTEXITCODE

      - name: Update von der Vorversion, Installieren und installierte App starten (Smoke-Test)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Update-Test: zuerst die vorherige veröffentlichte Version installieren (falls vorhanden)
          $version = (Select-Xml -Path pom.xml -XPath '/*[local-name()="project"]/*[local-name()="version"]').Node.InnerText
          $work = Join-Path $HOME "Keycloak Theme Emulator"
          $rels = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases?per_page=20"
          $old = $rels | Where-Object { $_.tag_name -ne "v$version" } | ForEach-Object { $_.assets | Where-Object { $_.name -like '*-windows-x64.msi' } } | Select-Object -First 1
          if ($old) {
            Write-Output "Ältere Version: $($old.name)"
            $oldMsi = Join-Path $env:RUNNER_TEMP $old.name
            Invoke-WebRequest -UseBasicParsing $old.browser_download_url -OutFile $oldMsi
            $p = Start-Process msiexec.exe -ArgumentList "/i `"$oldMsi`" /qn" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Write-Output "Alte Version nicht installierbar ($($p.ExitCode))"; exit 1 }
            $oldExe = Get-ChildItem $env:LOCALAPPDATA -Recurse -Depth 3 -Filter "Keycloak Theme Emulator.exe" | Select-Object -First 1
            Start-Process $oldExe.FullName -ArgumentList "--check" -Wait | Out-Null   # legt den Arbeitsordner an
            New-Item -ItemType Directory -Force (Join-Path $work "themes\update-test\login") | Out-Null
            Set-Content (Join-Path $work "themes\update-test\login\theme.properties") "parent=keycloak.v2"
            Set-Content (Join-Path $work "ui-settings.json") '{"kcemu-ui":"{\"appearance\":\"dark\"}"}'
            Copy-Item (Join-Path $work "scenario.json") (Join-Path $env:RUNNER_TEMP "scenario-before.json")
          } else {
            Write-Output "Keine ältere Version veröffentlicht – Update-Test entfällt."
          }
          # Installation über dasselbe Skript wie beim Nutzer (install-windows.ps1), nur mit der eben gebauten .msi
          $msi = (Get-ChildItem target/installer/*.msi | Select-Object -First 1).FullName
          try {
            ./install-windows.ps1 -Msi $msi -NoStart
          } catch {
            Write-Output $_
            Get-Content (Join-Path $env:TEMP "keycloak-theme-emulator-install.log") -Tail 60 -ErrorAction SilentlyContinue
            exit 1
          }
          $exe = Get-ChildItem $env:LOCALAPPDATA, $env:ProgramFiles -Recurse -Depth 3 -Filter "Keycloak Theme Emulator.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $menu = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "Keycloak Theme Emulator*.lnk" -ErrorAction SilentlyContinue
          Write-Output "Startmenü: $($menu.FullName -join ', ')"
          $r = Start-Process $exe.FullName -ArgumentList "--check", "--locale", "de" -Wait -PassThru
          Get-Content (Join-Path $HOME "Keycloak Theme Emulator\emulator.log")
          if (-not $menu) { Write-Output "Startmenü-Eintrag fehlt"; exit 1 }
          # genau eine Installation, und zwar die neue; Vorlagen und Einstellungen erhalten
          $keys = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          $inst = @(Get-ItemProperty $keys -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -eq 'Keycloak Theme Emulator' })
          Write-Output ("Installiert: " + (($inst | ForEach-Object { $_.DisplayVersion }) -join ', '))
          if ($inst.Count -ne 1 -or -not $inst[0].DisplayVersion.StartsWith($version)) { Write-Output "::error::Nicht genau eine Installation der neuen Version"; exit 1 }
          if ($old) {
            if (-not (Test-Path (Join-Path $work "themes\update-test\login\theme.properties"))) { Write-Output "::error::Eigenes Theme fehlt nach dem Update"; exit 1 }
            if (-not (Select-String -Quiet -Path (Join-Path $work "ui-settings.json") -Pattern 'appearance')) { Write-Output "::error::Einstellungen fehlen nach dem Update"; exit 1 }
            if ((Get-FileHash (Join-Path $work "scenario.json")).Hash -ne (Get-FileHash (Join-Path $env:RUNNER_TEMP "scenario-before.json")).Hash) { Write-Output "::error::scenario.json wurde verändert"; exit 1 }
            Write-Output "Update von $($old.name) erfolgreich: alte Version entfernt, Themes und Einstellungen erhalten."
          }
          exit $r.ExitCode

      - name: Dateiname mit Plattform
        id: name
        run: |
          VERSION="$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)"
          FILE="Keycloak-Theme-Emulator-${VERSION}-windows-x64.msi"
          mv target/installer/*.msi "target/installer/$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.file }}
          path: target/installer/${{ steps.name.outputs.file }}
          if-no-files-found: error

  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Portables ZIP bauen
        id: zip
        run: |
          packaging/build-portable.sh
          echo "file=$(cd target/portable && ls *.zip)" >> "$GITHUB_OUTPUT"

      - name: Entpacktes ZIP starten (Smoke-Test)
        run: |
          mkdir -p "$RUNNER_TEMP/zip"
          unzip -q "target/portable/${{ steps.zip.outputs.file }}" -d "$RUNNER_TEMP/zip"
          DIR="$(ls -d "$RUNNER_TEMP"/zip/*/)"
          (cd / && "$DIR/start-linux.sh" > "$RUNNER_TEMP/start.log" 2>&1 &)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8899/ && break; sleep 1; done
          cat "$RUNNER_TEMP/start.log"
          curl -sf http://127.0.0.1:8899/api/page/login | grep -q '"status" : 200'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.file }}
          path: target/portable/${{ steps.zip.outputs.file }}
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [dmg, msi, portable]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GitHub-Release anlegen (falls für diese Version noch keines existiert)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          # Version aus dem Dateinamen der portablen Fassung: Keycloak-Theme-Emulator-<version>-portable.zip
          VERSION="$(ls dist/*-portable.zip | sed -E 's/.*Keycloak-Theme-Emulator-(.+)-portable\.zip/\1/')"
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG existiert bereits – nichts zu tun (für ein neues Release Version in pom.xml erhöhen)."
            exit 0
          fi
          gh release create "$TAG" dist/*.dmg dist/*.msi dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Keycloak Theme Emulator ${VERSION}" \
            --notes "macOS-App (.dmg) für Apple Silicon (arm64) und Intel (x64), Windows-Installer (.msi, x64) sowie portable Fassung (ZIP) für macOS, Windows und Linux mit Java 21. Installation, Update und erster Start: siehe README. Änderungen: siehe CHANGELOG.md."
